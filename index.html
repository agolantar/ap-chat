<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Pure Sovereign P2P v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66;
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-main); color: var(--text-neon);
            font-family: var(--font-terminal); padding: 20px;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .terminal-container {
            max-width: 700px; width: 100%; background-color: var(--bg-window);
            border: 2px solid var(--text-dim); box-shadow: 6px 6px 0px var(--border-dark); padding: 20px;
        }
        .top-bar {
            background-color: var(--text-dim); color: var(--bg-main); padding: 4px 10px;
            font-weight: bold; font-size: 0.8rem; margin-bottom: 15px; display: flex; justify-content: space-between;
        }
        .chat-box {
            border: 1px solid var(--text-dim); background-color: #000; height: 180px;
            padding: 12px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 15px;
        }
        .field-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 0.65rem; color: var(--text-dim); text-transform: uppercase; }
        .field {
            background-color: #000; border: 1px solid var(--text-dim); color: var(--text-neon);
            padding: 8px; font-family: var(--font-terminal); font-size: 0.8rem; width: 100%;
        }
        .btn {
            background-color: var(--text-dim); border: 1px solid var(--text-neon); color: var(--bg-main);
            padding: 10px; font-family: var(--font-terminal); font-size: 0.8rem; font-weight: bold;
            cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 5px;
        }
        .btn:hover { background-color: var(--text-neon); }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="top-bar"><span>AP_PURE_P2P_TERMINAL_v1.0</span><span>[X]</span></div>

        <div class="chat-box" id="logBox">
            <div style="color: var(--text-dim);">[СИСТЕМА]: Автономный режим. Внешние серверы отключены.</div>
        </div>

        <!-- ШАГ 1: Создание приглашения -->
        <div class="field-group">
            <label class="label">1. Скопируйте ваш сетевой ключ и отправьте его соседу:</label>
            <textarea id="localKey" class="field" style="height: 60px;" readonly placeholder="Нажмите кнопку ниже для генерации..."></textarea>
            <button class="btn" onclick="createOffer()">Создать приглашение связи</button>
        </div>

        <!-- ШАГ 2: Ввод ключа соседа -->
        <div class="field-group">
            <label class="label">2. Вставьте сетевой ключ соседа ниже:</label>
            <textarea id="remoteKey" class="field" style="height: 60px;" placeholder="Вставьте сюда ключ, который вам прислал сосед..."></textarea>
            <button class="btn" onclick="connectNode()">Подключить узел соседа</button>
        </div>

        <!-- Поле чата -->
        <div class="field-group" style="margin-top: 15px;">
            <label class="label">Пакет данных для отправки:</label>
            <input type="text" id="msgInput" class="field" placeholder="Введите текст...">
            <button class="btn" onclick="sendPacket()">Отправить напрямую по P2P</button>
        </div>
    </div>

    <script>
        var pc = new RTCPeerConnection({ iceServers: [] }); // Намертво вырезали любые STUN/TURN серверы
        var dataChannel;

        // Создаем локальный дата-канал (наш браузер теперь сам сервер)
        pc.ondatachannel = function(event) {
            dataChannel = event.channel;
            setupChannelEvents();
            printLog('[СИСТЕМА]: Сосед подключился напрямую к вашему устройству.');
        };

        function setupChannelEvents() {
            dataChannel.onopen = function() { printLog('[СИСТЕМА]: Прямой зашифрованный P2P-канал открыт!'); };
            dataChannel.onmessage = function(e) { printLog('<span style="color:var(--text-neon)">[СОСЕД]:</span> ' + e.data); };
        }

        // 1. Создание приглашения (Создаем SDP-ключ)
        function createOffer() {
            dataChannel = pc.createDataChannel("chat");
            setupChannelEvents();

            pc.createOffer().then(function(offer) {
                return pc.setLocalDescription(offer);
            }).then(function() {
                // Ждем сборки локальных координат и выдаем текстовый ключ
                setTimeout(function() {
                    document.getElementById('localKey').value = btoa(JSON.stringify(pc.localDescription));
                    printLog('[ИНФО]: Сетевой ключ сгенерирован. Передайте его соседу через флешку или любой мессенджер.');
                }, 500);
            });
        }

        // 2. Ручное подключение узла соседа
        function connectNode() {
            var rawKey = document.getElementById('remoteKey').value.trim();
            if (!rawKey) return;

            try {
                var jsonKey = JSON.parse(atob(rawKey));
                var desc = new RTCSessionDescription(jsonKey);

                pc.setRemoteDescription(desc).then(function() {
                    printLog('[СИСТЕМА]: Координаты соседа приняты.');
                    
                    if (desc.type === 'offer') {
                        // Если сосед прислал приглашение, мы создаем ответный ключ
                        pc.createAnswer().then(function(answer) {
                            return pc.setLocalDescription(answer);
                        }).then(function() {
                            document.getElementById('localKey').value = btoa(JSON.stringify(pc.localDescription));
                            printLog('[ВАЖНО]: Скопируйте ваш новый ответный ключ из поля 1 и отправьте его соседу в ответ!');
                        });
                    }
                });
            } catch(e) { alert("ОШИБКА: Некорректный формат сетевого ключа."); }
        }

        // 3. Прямая отправка без участия серверов интернета
        function sendPacket() {
            var input = document.getElementById('msgInput');
            if (!input || input.value.trim() === '' || !dataChannel || dataChannel.readyState !== 'open') {
                alert("Ошибка: Канал связи еще не открыт.");
                return;
            }
            var text = input.value.trim();
            dataChannel.send(text);
            printLog('<span style="color:#fff">[ВЫ]:</span> ' + text);
            input.value = '';
        }

        function printLog(html) {
            var box = document.getElementById('logBox');
            var div = document.createElement('div');
            div.style.marginBottom = '4px';
            div.innerHTML = html;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
