<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Secure Terminal Network v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66; /* Зеленый люминофор */
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-neon);
            font-family: var(--font-terminal);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .icq-terminal-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-window);
            border: 2px solid var(--text-dim);
            box-shadow: 6px 6px 0px var(--border-dark);
            padding: 20px;
        }

        .terminal-top-bar {
            background-color: var(--text-dim);
            color: var(--bg-main);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .status-header {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-neon);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }

        .terminal-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .terminal-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-field {
            background-color: #000000;
            border: 1px solid var(--text-dim);
            color: var(--text-neon);
            padding: 10px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            width: 100%;
        }

        .chat-display-window {
            border: 1px solid var(--text-dim);
            background-color: #000000;
            height: 240px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .terminal-btn {
            background-color: var(--text-dim);
            border: 1px solid var(--text-neon);
            color: var(--bg-main);
            padding: 12px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }
        .terminal-btn:hover { background-color: var(--text-neon); }
        .system-logs { font-size: 0.65rem; color: var(--text-dim); text-align: center; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="icq-terminal-container">
        <div class="terminal-top-bar">
            <span>AP_SECURE_CHAT_v1.0</span>
            <span>[X]</span>
        </div>

        <div class="status-header" id="myNodeDisplay">
            ВАШ UIN: [Подключение...]
        </div>

        <!-- Поле для ввода UIN соседа/собеседника -->
        <div class="terminal-input-group">
            <label class="terminal-label">UIN СОБЕСЕДНИКА (9 ЦИФР):</label>
            <input type="text" id="partnerUinInput" class="terminal-field" placeholder="Введите UIN соседа..." maxlength="9">
        </div>

        <div class="chat-display-window" id="chatHistoryBox">
            <div style="color: var(--text-dim);">[СИСТЕМА]: Инициализация интернет-канала WebSockets...</div>
        </div>

        <div class="terminal-input-group">
            <label class="terminal-label">Трансляция сообщения:</label>
            <input type="text" id="messageInput" class="terminal-field" placeholder="Введите текст пакета...">
        </div>

        <button class="terminal-btn" id="sendBtn">ОТПРАВИТЬ ПАКЕТ ДАННЫХ</button>

        <div class="system-logs">
            АННОНИМНЫЙ МЕЖДУГОРОДНИЙ ИНТЕРНЕТ ЧАТ // БЕЗ СЛЕДОВ // ЛОГИРОВАНИЕ: OFF
        </div>
    </div>

    <!-- ИНТЕРНЕТ ЛОГИКА СВЯЗИ -->
    <script>
        var ws;
        var myUIN = '';

        function initWebSocketChat() {
            // Генерируем постоянный 9-значный UIN для устройства, как в классической Аське
            var savedUIN = localStorage.getItem('ap_final_icq_uin');
            if (!savedUIN) {
                savedUIN = Math.floor(100000000 + Math.random() * 900000000).toString();
                localStorage.setItem('ap_final_icq_uin', savedUIN);
            }
            myUIN = savedUIN;
            document.getElementById('myNodeDisplay').innerText = 'ВАШ АНОНИМНЫЙ UIN: [' + myUIN + ']';

            // Подключаемся к стабильному международному WebSocket-серверу для трансляции данных
            ws = new WebSocket('wss://://socketsbay.com');

            ws.onopen = function() {
                appendSystemMessage('[СИСТЕМА]: Подключение к интернет-матрице выполнено успешно.');
                appendSystemMessage('[ИНФО]: Введите UIN соседа в поле выше и отправьте сообщение.');
            };

            // Принимаем пакеты из интернета
            ws.onmessage = function(event) {
                try {
                    var data = JSON.parse(event.data);
                    // Фильтруем сообщения: выводим на экран только то, что отправлено ИМЕННО на наш UIN
                    if (data && data.target === myUIN) {
                        appendChatMessage(data.sender, data.text);
                    }
                } catch(e) {
                    // Игнорируем чужой системный трафик
                }
            };

            ws.onerror = function() {
                appendSystemMessage('[ОШИБКА]: Сетевой сбой эфира. Попытка переподключения...');
            };
        }

        // ОТПРАВКА СООБЩЕНИЯ КОНКРЕТНОМУ СОСЕДУ
        function sendDirectMessage() {
            var textInput = document.getElementById('messageInput');
            var partnerInput = document.getElementById('partnerUinInput');
            
            if (!textInput || textInput.value.trim() === '') return;
            
            var targetPartner = partnerInput.value.trim();
            if (targetPartner.length !== 9) {
                alert("ОШИБКА: UIN собеседника должен состоять строго из 9 цифр.");
                return;
            }

            var rawMessage = textInput.value.trim();

            // Формируем пакет данных, указывая отправителя и цель
            var packet = {
                sender: myUIN,
                target: targetPartner,
                text: rawMessage
            };

            // Передаем пакет в интернет
            ws.send(JSON.stringify(packet));

            // Отображаем у себя на экране
            appendChatMessage('Вы', rawMessage);
            textInput.value = '';
        }

        function appendChatMessage(sender, text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = '6px';
            
            if (sender === 'Вы') {
                msgDiv.innerHTML = '<span style="color: #ffffff;">[Вы]:</span> ' + text;
            } else {
                msgDiv.innerHTML = '<span style="color: var(--text-neon);">[' + sender + ']:</span> ' + text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.color = 'var(--text-dim)';
            msgDiv.style.marginBottom = '6px';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', function() {
            initWebSocketChat();
            document.getElementById('sendBtn').onclick = sendDirectMessage;
            document.body.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
                    sendDirectMessage();
                }
            });
        });
    </script>
</body>
</html>
