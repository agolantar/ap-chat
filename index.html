<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Secure Terminal Network v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66; /* Зеленый люминофор */
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-neon);
            font-family: var(--font-terminal);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .icq-terminal-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-window);
            border: 2px solid var(--text-dim);
            box-shadow: 6px 6px 0px var(--border-dark);
            padding: 20px;
        }

        .terminal-top-bar {
            background-color: var(--text-dim);
            color: var(--bg-main);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .status-header {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-neon);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }

        .terminal-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .terminal-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-field {
            background-color: #000000;
            border: 1px solid var(--text-dim);
            color: var(--text-neon);
            padding: 10px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            width: 100%;
        }

        .chat-display-window {
            border: 1px solid var(--text-dim);
            background-color: #000000;
            height: 280px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .terminal-btn {
            background-color: var(--text-dim);
            border: 1px solid var(--text-neon);
            color: var(--bg-main);
            padding: 12px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }
        .terminal-btn:hover { background-color: var(--text-neon); }
        .system-logs { font-size: 0.65rem; color: var(--text-dim); text-align: center; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="icq-terminal-container">
        <div class="terminal-top-bar">
            <span>AP_SECURE_CHAT_v1.0</span>
            <span>[X]</span>
        </div>

        <div class="status-header" id="myNodeDisplay">
            ВАШ NODE ID: [Генерируется...]
        </div>

        <div class="chat-display-window" id="chatHistoryBox">
            <div style="color: var(--text-dim);">[СИСТЕМА]: Прямой зашифрованный канал WebRTC активен.</div>
            <div style="color: var(--text-dim);">[СИСТЕМА]: Подключение к пиринговой сети...</div>
        </div>

        <div class="terminal-input-group">
            <label class="terminal-label">Трансляция сообщения:</label>
            <input type="text" id="messageInput" class="terminal-field" placeholder="Введите текст...">
        </div>

        <button class="terminal-btn" id="sendBtn">ОТПРАВИТЬ ПАКЕТ ДАННЫХ</button>

        <div class="system-logs">
            ЧИСТЫЙ P2P ИНТЕРНЕТ // БЕЗ СЕРВЕРОВ // ХРАНЕНИЕ ЛОГОВ: ОТСУТСТВУЕТ
        </div>
    </div>
    <!-- ПОДКЛЮЧАЕМ БЕСПЛАТНУЮ БИБЛИОТЕКУ ДЛЯ ПРЯМОГО СОЕДИНЕНИЯ ПО ИНТЕРНЕТУ -->
    <script src="https://unpkg.com"></script>
    <script>
        var peer, conn;
        var myNodeID = '';

        // 1. ЗАПУСК КЛИЕНТСКОГО УЗЛА ПО СЕТИ ИНТЕРНЕТ
        function initP2P() {
            // Генерируем случайный короткий ID для сети
            myNodeID = 'Node-' + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('myNodeDisplay').innerText = 'ВАШ АНОНИМНЫЙ ID: [' + myNodeID + ']';

            // Инициализируем бесплатный независимый интернет-коммутатор PeerJS
            // Он нужен только для того, чтобы телефоны и ПК находили друг друга в сети
            peer = new Peer(myNodeID, {
                debug: 1
            });

            // Слушаем входящие подключения от других клиентов в интернете
            peer.on('connection', function(incomingConn) {
                conn = incomingConn;
                setupChatLogic();
                appendSystemMessage('[СИСТЕМА]: Входящий клиент подключен к вашему узлу.');
            });

            peer.on('open', function(id) {
                appendSystemMessage('[СИСТЕМА]: Узел успешно запущен в сеть интернет.');
                
                // Автоматически пытаемся создать общий мост:
                // Если вы открыли чат на телефоне, введите ID компьютера в чат, чтобы связать их
                autoConnectBridge();
            });
        }

        function autoConnectBridge() {
            // Для теста: если вы знаете ID другого человека, мессенджер свяжет вас напрямую
            var lastPartner = localStorage.getItem('last_partner_node');
            if (lastPartner) {
                connectToNode(lastPartner);
            }
        }

        function connectToNode(targetID) {
            appendSystemMessage('[СИСТЕМА]: Попытка прямого P2P-подключения к [' + targetID + ']...');
            conn = peer.connect(targetID);
            setupChatLogic();
        }

        function setupChatLogic() {
            conn.on('open', function() {
                appendSystemMessage('[СИСТЕМА]: Прямое сквозное соединение установлено!');
                localStorage.setItem('last_partner_node', conn.peer);
            });

            // Ловим сообщения напрямую из интернета от собеседника
            conn.on('data', function(data) {
                if (data && data.text) {
                    appendChatMessage(data.sender, data.text);
                }
            });
        }

        // 2. ОТПРАВКА ТЕКСТА НАПРЯМУЮ СОБЕСЕДНИКУ
        function sendMessage() {
            var input = document.getElementById('messageInput');
            if (!input || input.value.trim() === '') return;
            var text = input.value.trim();

            // Если мы еще ни к кому не подключились, первая строка расценивается как команда коннекта
            if (!conn || !conn.open) {
                // Если ввели чужой Node-XXXX, подключаемся к нему по интернету
                if (text.indexOf('Node-') === 0) {
                    connectToNode(text);
                    input.value = '';
                    return;
                }
                appendSystemMessage('[ИНФО]: Чтобы начать чат по интернету, введите ID другого устройства (например: Node-1234)');
                return;
            }

            // Отправляем пакет по интернету напрямую на устройство собеседника
            conn.send({
                sender: myNodeID,
                text: text
            });

            appendChatMessage('Вы', text);
            input.value = '';
        }

        function appendChatMessage(sender, text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = '6px';
            
            if (sender === 'Вы') {
                msgDiv.innerHTML = '<span style="color: #ffffff;">[Вы]:</span> ' + text;
            } else {
                msgDiv.innerHTML = '<span style="color: var(--text-neon);">[' + sender + ']:</span> ' + text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.color = 'var(--text-dim)';
            msgDiv.style.marginBottom = '6px';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', function() {
            initP2P();
            document.getElementById('sendBtn').onclick = sendMessage;
            document.body.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
                    sendMessage();
                }
            });
        });
    </script>
</body>
</html>
