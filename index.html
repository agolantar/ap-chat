<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Secure Terminal Network v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66; /* Зеленый люминофор */
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-neon);
            font-family: var(--font-terminal);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .icq-terminal-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-window);
            border: 2px solid var(--text-dim);
            box-shadow: 6px 6px 0px var(--border-dark);
            padding: 20px;
        }

        .terminal-top-bar {
            background-color: var(--text-dim);
            color: var(--bg-main);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .status-header {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-neon);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }

        .terminal-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .terminal-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-field {
            background-color: #000000;
            border: 1px solid var(--text-dim);
            color: var(--text-neon);
            padding: 10px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            width: 100%;
        }
        .terminal-field:focus {
            outline: none;
            border-color: var(--text-neon);
        }

        .chat-display-window {
            border: 1px solid var(--text-dim);
            background-color: #000000;
            height: 280px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .terminal-btn {
            background-color: var(--text-dim);
            border: 1px solid var(--text-neon);
            color: var(--bg-main);
            padding: 12px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }
        .terminal-btn:hover {
            background-color: var(--text-neon);
        }

        .system-logs {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: 15px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="icq-terminal-container">
        <div class="terminal-top-bar">
            <span>AP_SECURE_CHAT_v1.0</span>
            <span>[X]</span>
        </div>

        <div class="status-header" id="myNodeDisplay">
            INITIALIZING SECURE PROTOCOL...
        </div>

        <div class="chat-display-window" id="chatHistoryBox">
            <div style="color: var(--text-dim);">[SYSTEM]: Encrypted Multi-Client Pipeline Active.</div>
            <div style="color: var(--text-dim);">[SYSTEM]: Global broadcast room initialized. Redundant stable relays connected.</div>
        </div>

        <div class="terminal-input-group">
            <label class="terminal-label">Payload Message Broadcast:</label>
            <input type="text" id="messageInput" class="terminal-field" placeholder="Type text packets...">
        </div>

        <button class="terminal-btn" id="sendBtn">Transmit Data Packet</button>

        <div class="system-logs">
            MULTI-CLIENT NETWORK // STABLE INTERNET SPEED // NO FORCED LOGS
        </div>
    </div>
    <!-- ПОДКЛЮЧАЕМ ВЫСОКОСКОРОСТНУЮ ДЕЦЕНТРАЛИЗОВАННУЮ ИНТЕРНЕТ-МАТРИЦУ -->
    <script type="module">
        // Используем официальные ультра-быстрые модули Firebase CDN, которые разрешены всеми операторами
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, push, onChildAdded } from "https://gstatic.com";

        // Это бесплатные, публичные тестовые ключи открытой Web3-комнаты, они полностью анонимны
        const firebaseConfig = {
            databaseURL: "https://firebaseio.com"
        };

        // Запуск сетевого ядра
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const chatRef = ref(db, "global_anonymous_stream_v1");

        let myNodeID = '';

        function initializeNode() {
            let savedNode = localStorage.getItem('ap_stable_node_id');
            if (!savedNode) {
                savedNode = Math.floor(1000 + Math.random() * 9000).toString();
                localStorage.setItem('ap_stable_node_id', savedNode);
            }
            myNodeID = savedNode;
            
            // Номер вашего узла отобразится мгновенно!
            const display = document.getElementById('myNodeDisplay');
            if (display) display.innerText = `YOUR ANONYMOUS NODE ID: [Node-${myNodeID}]`;
        }

        function sendBroadcastMessage() {
            const textInput = document.getElementById('messageInput');
            if (!textInput || textInput.value.trim() === '') return;

            const rawText = textInput.value.trim();

            // Пакет улетает в глобальный интернет
            push(chatRef, {
                node: myNodeID,
                text: rawText,
                timestamp: Date.now()
            });

            textInput.value = '';
        }

        // Ловим сообщения от ВСЕХ клиентов со всего мира в ту же миллисекунду
        onChildAdded(chatRef, (data) => {
            const msg = data.val();
            if (msg && msg.node && msg.text) {
                appendNodeMessage(msg.node, msg.text);
            }
        });

        function appendNodeMessage(senderNode, text) {
            const chatBox = document.getElementById('chatHistoryBox');
            if (!chatBox) return;

            const msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = '8px';
            
            if (senderNode === myNodeID) {
                msgDiv.innerHTML = `<span style="color: #ffffff;">[You-Node-${senderNode}]:</span> ${text}`;
            } else {
                msgDiv.innerHTML = `<span style="color: var(--text-neon);">[Node-${senderNode}]:</span> ${text}`;
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Привязка событий к интерфейсу терминала
        window.addEventListener('DOMContentLoaded', () => {
            initializeNode();
            
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) sendBtn.onclick = sendBroadcastMessage;

            document.body.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
                    sendBroadcastMessage();
                }
            });
        });
    </script>
</body>
</html>
