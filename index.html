<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Sovereign Mesh Node v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66; /* Зеленый люминофор */
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-neon);
            font-family: var(--font-terminal);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .icq-terminal-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-window);
            border: 2px solid var(--text-dim);
            box-shadow: 6px 6px 0px var(--border-dark);
            padding: 20px;
        }

        .terminal-top-bar {
            background-color: var(--text-dim);
            color: var(--bg-main);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .status-header {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-neon);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }

        .terminal-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .terminal-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-field {
            background-color: #000000;
            border: 1px solid var(--text-dim);
            color: var(--text-neon);
            padding: 10px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            width: 100%;
        }

        .chat-display-window {
            border: 1px solid var(--text-dim);
            background-color: #000000;
            height: 220px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .terminal-btn {
            background-color: var(--text-dim);
            border: 1px solid var(--text-neon);
            color: var(--bg-main);
            padding: 12px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }
        .terminal-btn:hover { background-color: var(--text-neon); }
        .system-logs { font-size: 0.65rem; color: var(--text-dim); text-align: center; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="icq-terminal-container">
        <div class="terminal-top-bar">
            <span>AP_MESH_NODE_v1.0</span>
            <span>[X]</span>
        </div>

        <div class="status-header" id="myNodeDisplay">
            ВАШ UIN СЕРВЕРА: [Инициализация...]
        </div>

        <!-- Поля для децентрализованного обмена ключами соседа -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div class="terminal-input-group" style="flex: 1; margin-bottom: 0;">
                <label class="terminal-label">UIN СОСЕДА ДЛЯ СВЯЗИ:</label>
                <input type="text" id="partnerUinInput" class="terminal-field" placeholder="000000000" maxlength="9">
            </div>
            <div class="terminal-input-group" style="flex: 1; margin-bottom: 0;">
                <label class="terminal-label">КЛЮЧ ШИФРОВАНИЯ (AES):</label>
                <input type="password" id="cryptoKeyInput" class="terminal-field" placeholder="Общий пароль...">
            </div>
        </div>

        <div class="chat-display-window" id="chatHistoryBox">
            <div style="color: var(--text-dim);">[СИСТЕМА]: Генерация криптографических ключей узла...</div>
        </div>

        <div class="terminal-input-group">
            <label class="terminal-label">Трансляция сообщения напрямую в узел соседа:</label>
            <input type="text" id="messageInput" class="terminal-field" placeholder="Введите текст сообщения...">
        </div>

        <button class="terminal-btn" id="sendBtn">ОТПРАВИТЬ НАПРЯМУЮ (P2P)</button>

        <div class="system-logs">
            100% P2P MESH // КАЖДЫЙ БРАУЗЕР СЕРВЕР // LOGS: ABSENT
        </div>
    </div>
    <!-- ВСТРОЕННЫЙ КРИПТОШИФРАТОР И БЕЗСЕРВЕРНЫЙ СВЯЗНОЙ МОДУЛЬ -->
    <script src="https://cloudflare.com"></script>
    <script src="https://unpkg.com"></script>
    <script>
        var peer, conn;
        var myUIN = '';

        function initMeshServer() {
            // Генерируем уникальный 9-значный номер сервера для этого устройства
            var savedUIN = localStorage.getItem('ap_mesh_uin_v1');
            if (!savedUIN) {
                savedUIN = Math.floor(100000000 + Math.random() * 900000000).toString();
                localStorage.setItem('ap_mesh_uin_v1', savedUIN);
            }
            myUIN = savedUIN;
            document.getElementById('myNodeDisplay').innerText = 'ВАШ UIN СЕРВЕРА: [' + myUIN + ']';

            // Инициализируем локальный сервер внутри браузера.
            // Для обхода NAT роутеров код использует встроенные в любой браузер бесплатные STUN-серверы Google.
            // Они не видят сообщения, а работают как зеркало, помогая телефонам узнать свой внешний IP-адрес.
            peer = new Peer('ap-node-' + myUIN, {
                config: { 'iceServers': [{ 'urls': 'stun:://google.com' }] },
                debug: 1
            });

            // Слушаем входящие запросы. Наш браузер сам выступает в роли принимающего сервера!
            peer.on('connection', function(incomingConn) {
                conn = incomingConn;
                bindMeshEvents();
                appendSystemMessage('[СИСТЕМА]: Внешний узел соседа успешно подключился к вашему серверу.');
            });

            peer.on('open', function() {
                var box = document.getElementById('chatHistoryBox');
                box.innerHTML = '';
                appendSystemMessage('[СИСТЕМА]: Ваш локальный P2P-сервер успешно запущен в сеть интернет.');
                appendSystemMessage('[ИНФО]: Введите UIN соседа и общий пароль для установления моста.');
            });

            peer.on('error', function(err) {
                if (err.type === 'peer-not-found') {
                    appendSystemMessage('[ОШИБКА]: Узел соседа не найден в сети. Убедитесь, что его сайт открыт.');
                } else {
                    appendSystemMessage('[ОШИБКА СЕТИ]: Защита роутера заблокировала прямое соединение.');
                }
            });
        }

        // ПОДКЛЮЧЕНИЕ К СЕРВЕРУ СОСЕДА ПО ЕГО UIN
        function connectToNeighbour() {
            var partnerInput = document.getElementById('partnerUinInput').value.trim();
            if (partnerInput.length !== 9) return false;

            if (!conn || conn.peer !== 'ap-node-' + partnerInput) {
                appendSystemMessage('[СИСТЕМА]: Подключение к серверу соседа [' + partnerInput + ']...');
                conn = peer.connect('ap-node-' + partnerInput, { reliable: true });
                bindMeshEvents();
            }
            return true;
        }

        function bindMeshEvents() {
            conn.on('open', function() {
                appendSystemMessage('[СИСТЕМА]: Сквозной прямой P2P-канал связи установлен.');
            });

            // Прием пакетов данных напрямую в память браузера (в обход сайтов и серверов)
            conn.on('data', function(data) {
                if (data && data.encryptedText) {
                    var passKey = document.getElementById('cryptoKeyInput').value.trim();
                    if (!passKey) {
                        appendChatMessage(data.sender, '[ЗАБЛОКИРОВАНО]: Введите пароль шифрования.');
                        return;
                    }

                    // Дешифруем текст прямо внутри процессора вашего устройства
                    try {
                        var bytes = CryptoJS.AES.decrypt(data.encryptedText, passKey);
                        var decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                        if (!decryptedText) throw new Error();
                        appendChatMessage(data.sender, decryptedText);
                    } catch(e) {
                        appendChatMessage(data.sender, '[ОШИБКА РАСШИФРОВКИ]: Неверный ключ.');
                    }
                }
            });
        }

        // ПРЯМАЯ ОТПРАВКА С ИСПОЛЬЗОВАНИЕМ СКВОЗНОГО ШИФРОВАНИЯ
        function transmitPacket() {
            var textInput = document.getElementById('messageInput');
            var keyInput = document.getElementById('cryptoKeyInput');
            
            if (!textInput || textInput.value.trim() === '') return;
            
            var passKey = keyInput.value.trim();
            if (!passKey) {
                alert("ОШИБКА: Задайте пароль шифрования для защиты данных!");
                return;
            }

            // Пытаемся подключиться к соседу. Если он еще не открыл узел, функция предупредит об этом.
            if (!connectToNeighbour() && (!conn || !conn.open)) {
                alert("ОШИБКА: Укажите корректный 9-значный UIN соседа.");
                return;
            }

            var rawMessage = textInput.value.trim();
            
            // Шифруем сообщение перед тем, как оно покинет ваш компьютер
            var encrypted = CryptoJS.AES.encrypt(rawMessage, passKey).toString();

            // Шлем пакет в интернет-эфир напрямую на IP-адрес соседа
            if (conn && conn.open) {
                conn.send({
                    sender: myUIN,
                    encryptedText: encrypted
                });
                appendChatMessage('Вы', rawMessage);
                textInput.value = '';
            } else {
                appendSystemMessage('[СИСТЕМА]: Устанавливаем мост связи, повторите отправку через 2 секунды...');
            }
        }

        function appendChatMessage(sender, text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = '6px';
            if (sender === 'Вы') {
                msgDiv.innerHTML = '<span style="color: #ffffff;">[Вы]:</span> ' + text;
            } else {
                msgDiv.innerHTML = '<span style="color: var(--text-neon);">[Node-' + sender + ']:</span> ' + text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.color = 'var(--text-dim)';
            msgDiv.style.marginBottom = '6px';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', function() {
            initMeshServer();
            document.getElementById('sendBtn').onclick = transmitPacket;
            document.body.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
                    transmitPacket();
                }
            });
        });
    </script>
</body>
</html>
