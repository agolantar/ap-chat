<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AP // Secure Terminal Network v1.0</title>
    <style>
        :root {
            --bg-main: #020202;
            --bg-window: #0c0c0c;
            --text-neon: #00ff66; /* Зеленый люминофор */
            --text-dim: #00aa44;
            --border-dark: #000000;
            --font-terminal: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-main);
            color: var(--text-neon);
            font-family: var(--font-terminal);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .icq-terminal-container {
            max-width: 600px;
            width: 100%;
            background-color: var(--bg-window);
            border: 2px solid var(--text-dim);
            box-shadow: 6px 6px 0px var(--border-dark);
            padding: 20px;
        }

        .terminal-top-bar {
            background-color: var(--text-dim);
            color: var(--bg-main);
            padding: 4px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }

        .status-header {
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-neon);
            margin-bottom: 20px;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--text-dim);
            padding-bottom: 10px;
        }

        .terminal-input-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .terminal-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .terminal-field {
            background-color: #000000;
            border: 1px solid var(--text-dim);
            color: var(--text-neon);
            padding: 10px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            width: 100%;
        }

        .chat-display-window {
            border: 1px solid var(--text-dim);
            background-color: #000000;
            height: 220px;
            padding: 12px;
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .terminal-btn {
            background-color: var(--text-dim);
            border: 1px solid var(--text-neon);
            color: var(--bg-main);
            padding: 12px;
            font-family: var(--font-terminal);
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
        }
        .terminal-btn:hover { background-color: var(--text-neon); }
        .system-logs { font-size: 0.65rem; color: var(--text-dim); text-align: center; margin-top: 15px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="icq-terminal-container">
        <div class="terminal-top-bar">
            <span>AP_SECURE_CHAT_v1.0</span>
            <span>[X]</span>
        </div>

        <div class="status-header" id="myNodeDisplay">
            ВАШ UIN: [Подключение...]
        </div>

        <!-- Блок ввода параметров сессии -->
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <div class="terminal-input-group" style="flex: 1; margin-bottom: 0;">
                <label class="terminal-label">UIN СОБЕСЕДНИКА (9 ЦИФР):</label>
                <input type="text" id="partnerUinInput" class="terminal-field" placeholder="000000000" maxlength="9">
            </div>
            <div class="terminal-input-group" style="flex: 1; margin-bottom: 0;">
                <label class="terminal-label">КЛЮЧ ШИФРОВАНИЯ (AES):</label>
                <input type="password" id="cryptoKeyInput" class="terminal-field" placeholder="Пароль с соседом...">
            </div>
        </div>

        <div class="chat-display-window" id="chatHistoryBox">
            <div style="color: var(--text-dim);">[СИСТЕМА]: Инициализация интернет-канала...</div>
        </div>

        <div class="terminal-input-group">
            <label class="terminal-label">Трансляция зашифрованного сообщения:</label>
            <input type="text" id="messageInput" class="terminal-field" placeholder="Введите текст...">
        </div>

        <button class="terminal-btn" id="sendBtn">ОТПРАВИТЬ ЗАШИФРОВАННЫЙ ПАКЕТ</button>

        <div class="system-logs">
            END-TO-END CRYPTO v1.0 // СЕРВЕР ВИДИТ ТОЛЬКО МУСОР // LOGS: NULL
        </div>
    </div>
    <!-- ПОДКЛЮЧАЕМ НАДЕЖНЫЙ КРИПТОГРАФИЧЕСКИЙ ШИФРАТОР CRYPTO-JS -->
    <script src="https://cloudflare.com"></script>
    <script>
        var ws;
        var myUIN = '';

        function initCryptoChat() {
            var savedUIN = localStorage.getItem('ap_crypto_icq_uin');
            if (!savedUIN) {
                savedUIN = Math.floor(100000000 + Math.random() * 900000000).toString();
                localStorage.setItem('ap_crypto_icq_uin', savedUIN);
            }
            myUIN = savedUIN;
            document.getElementById('myNodeDisplay').innerText = 'ВАШ АНОНИМНЫЙ UIN: [' + myUIN + ']';

            // ПОДКЛЮЧАЕМ НАДЕЖНЫЙ СТАБИЛЬНЫЙ МЕЖДУНАРОДНЫЙ ШЛЮЗ PIESOCKET (РАБОТАЕТ БЕЗ БЛОКИРОВОК)
            ws = new WebSocket('wss://://piesocket.com');

            ws.onopen = function() {
                var box = document.getElementById('chatHistoryBox');
                box.innerHTML = ''; // Стираем надпись Инициализация
                appendSystemMessage('[СИСТЕМА]: Подключение к интернет-каналу выполнено успешно.');
                appendSystemMessage('[ИНФО]: Задайте с соседом одинаковый КЛЮЧ ШИФРОВАНИЯ перед отправкой.');
            };

            ws.onmessage = function(event) {
                try {
                    var data = JSON.parse(event.data);
                    // Ловим пакеты, адресованные строго нашему UIN
                    if (data && data.target === myUIN) {
                        var passKey = document.getElementById('cryptoKeyInput').value.trim();
                        
                        if (!passKey) {
                            appendChatMessage(data.sender, '[ЗАБЛОКИРОВАНО]: Установите ключ шифрования, чтобы прочесть.');
                            return;
                        }

                        // РАСШИФРОВКА: Из каши символов собираем текст с помощью общего пароля
                        try {
                            var bytes = CryptoJS.AES.decrypt(data.encryptedText, passKey);
                            var decryptedText = bytes.toString(CryptoJS.enc.Utf8);
                            
                            if (!decryptedText) throw new Error();
                            appendChatMessage(data.sender, decryptedText);
                        } catch(err) {
                            appendChatMessage(data.sender, '[ОШИБКА РАСШИФРОВКИ]: Неверный ключ шифрования.');
                        }
                    }
                } catch(e) {}
            };

            ws.onerror = function() {
                var box = document.getElementById('chatHistoryBox');
                box.innerHTML = '';
                appendSystemMessage('[ОШИБКА]: Внешний шлюз недоступен. Проверьте подключение к сети.');
            };
        }

        // ЗАШИФРОВКА И ОТПРАВКА
        function sendEncryptedMessage() {
            var textInput = document.getElementById('messageInput');
            var partnerInput = document.getElementById('partnerUinInput');
            var keyInput = document.getElementById('cryptoKeyInput');
            
            if (!textInput || textInput.value.trim() === '') return;
            
            var targetPartner = partnerInput.value.trim();
            var passKey = keyInput.value.trim();

            if (targetPartner.length !== 9) {
                alert("ОШИБКА: Укажите 9-значный UIN соседа.");
                return;
            }
            if (!passKey) {
                alert("КРИТИЧЕСКАЯ ОШИБКА: Без Ключа Шифрования отправка запрещена ради вашей анонимности!");
                return;
            }

            var rawMessage = textInput.value.trim();

            // ШИФРОВАНИЕ: Полностью перемешиваем исходный текст алгоритмом AES на основе пароля
            var encrypted = CryptoJS.AES.encrypt(rawMessage, passKey).toString();

            var packet = {
                sender: myUIN,
                target: targetPartner,
                encryptedText: encrypted // Сервер в интернете видит только этот зашифрованный хэш
            };

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(packet));
            } else {
                alert("ОШИБКА: Интернет-соединение не активно.");
                return;
            }

            appendChatMessage('Вы', rawMessage);
            textInput.value = '';
        }

        function appendChatMessage(sender, text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.marginBottom = '6px';
            
            if (sender === 'Вы') {
                msgDiv.innerHTML = '<span style="color: #ffffff;">[Вы]:</span> ' + text;
            } else {
                msgDiv.innerHTML = '<span style="color: var(--text-neon);">[' + sender + ']:</span> ' + text;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            var chatBox = document.getElementById('chatHistoryBox');
            var msgDiv = document.createElement('div');
            msgDiv.style.color = 'var(--text-dim)';
            msgDiv.style.marginBottom = '6px';
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.addEventListener('DOMContentLoaded', function() {
            initCryptoChat();
            document.getElementById('sendBtn').onclick = sendEncryptedMessage;
            document.body.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && document.activeElement.id === 'messageInput') {
                    sendEncryptedMessage();
                }
            });
        });
    </script>
</body>
</html>
